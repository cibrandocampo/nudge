# Security headers for everything nginx serves itself (the SPA and its
# assets). Included per location, never at server level: a server-level
# add_header would also reach the /api/ and /admin/ proxies, which carry
# Django's own headers, and nginx drops inherited add_header directives in
# any location that declares one of its own (the assets block does).
#
# CSP notes:
# - No inline script or style is allowed. The build emits none, and React
#   sets style props through the CSSOM, which CSP does not govern.
# - img-src data: covers the select chevron, an SVG data URI in
#   forms.module.css; an image cannot run script.
# - 'wasm-unsafe-eval' lets the barcode scanner compile its same-origin
#   zxing-wasm decoder; it does not allow eval() of JavaScript.
# - camera=(self) in Permissions-Policy: the scanner reads the camera.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
