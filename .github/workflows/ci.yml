name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nudge
          POSTGRES_USER: nudge
          POSTGRES_PASSWORD: nudge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r ../dev/requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: coverage run manage.py test
        env:
          DATABASE_URL: postgres://nudge:nudge@localhost:5432/nudge
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-secret-key-not-used-in-production
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost
      - run: coverage xml
      # `coverage xml` runs from `backend/`, so the filename attributes in
      # coverage.xml are relative to that dir (e.g. `apps/routines/models.py`).
      # Codecov ingests those paths verbatim and can't map them back to the
      # repo (the real path is `backend/apps/routines/models.py`), so files
      # upload but don't appear in the code tree. Prefix `backend/` to every
      # `filename="..."` before the upload so the paths resolve.
      - run: sed -i 's|filename="|filename="backend/|g' coverage.xml
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          verbose: true

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: corepack enable npm && corepack prepare npm@11 --activate
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # Full Playwright suite against the real dev stack (Postgres, Redis, Django,
  # Celery, the Vite dev server and the production-build preview with its
  # service worker), both projects, no retries: a flaky spec has a cause to
  # find, not a retry to hide behind. Gates PRs only; the image builds below
  # keep depending on the unit jobs.
  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Write the dev stack's .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=nudge
          POSTGRES_USER=nudge
          POSTGRES_PASSWORD=ci
          REDIS_PASSWORD=ci
          DJANGO_SECRET_KEY=ci-secret-key-not-used-in-production
          DJANGO_DEBUG=True
          E2E_SEED_ALLOWED=true
          ADMIN_USERNAME=admin
          ADMIN_EMAIL=admin@example.com
          ADMIN_PASSWORD=adminpass
          EOF
          # A throwaway VAPID pair, so push-realtime.spec can subscribe. The
          # backend wants the PKCS#8 DER private key in base64 and the public
          # key as the base64url uncompressed point (what `vapid --gen` makes).
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/vapid.pem"
          echo "VAPID_PRIVATE_KEY=$(openssl pkcs8 -topk8 -nocrypt -in "$RUNNER_TEMP/vapid.pem" -outform DER | base64 -w0)" >> .env
          echo "VAPID_PUBLIC_KEY=$(openssl ec -in "$RUNNER_TEMP/vapid.pem" -pubout -outform DER 2>/dev/null | tail -c 65 | base64 -w0 | tr '+/' '-_' | tr -d '=')" >> .env
      - uses: docker/setup-buildx-action@v4
      - name: Build the E2E image
        uses: docker/build-push-action@v7
        with:
          context: ./e2e
          file: ./e2e/Dockerfile
          tags: nudge-e2e
          load: true
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
      - name: Start the dev stack
        run: >
          docker compose --env-file .env -f dev/docker-compose.yml --profile preview
          up -d --build db redis mailpit backend celery frontend frontend-preview
      # The backend migrates and creates the admin before serving; the preview
      # runs `vite build` first. Wait for all three to answer.
      - name: Wait for backend, dev server and preview
        run: |
          for url in http://localhost:18000/api/health/ http://localhost:15173/ http://localhost:14173/; do
            echo "Waiting for $url"
            timeout 600 sh -c "until curl -sf -o /dev/null $url; do sleep 3; done"
          done
      - name: Run Playwright (chromium-dev + chromium-preview)
        run: >
          docker run --rm --network host
          -e E2E_USERNAME=admin -e E2E_PASSWORD=adminpass -e DEMO_USERS_PASSWORD=change-me
          -v "$PWD/e2e/playwright-report:/e2e/playwright-report"
          -v "$PWD/e2e/test-results:/e2e/test-results"
          nudge-e2e npx playwright test --retries=0
      - name: Dump service logs
        if: failure()
        run: docker compose --env-file .env -f dev/docker-compose.yml --profile preview logs --no-color > e2e-stack.log
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e-stack.log
          retention-days: 14

  build-backend:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute app version
        id: version
        run: |
          echo "value=$(git describe --tags --always --abbrev=5)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cibrandocampo/nudge-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.version.outputs.built_at }}
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cibrandocampo/nudge-backend
          readme-filepath: ./README.md

  build-frontend:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute app version
        id: version
        run: echo "value=$(git describe --tags --always --abbrev=5)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: cibrandocampo/nudge-frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
      - uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.value }}
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: cibrandocampo/nudge-frontend
          readme-filepath: ./README.md
