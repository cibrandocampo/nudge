# Monthly and grouped, so updates arrive as a few PRs. Majors come one by one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Each requirements.txt is compiled from the requirements.in next to it.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Django stays on the 5.2 LTS until a deliberate upgrade.
      - dependency-name: django
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /dev
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Playwright tag of the base image in e2e/Dockerfile.
      - dependency-name: '@playwright/test'
